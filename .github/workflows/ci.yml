name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile scripts
        run: python -m compileall -q .
      - name: Ruff (syntax errors and pyflakes)
        run: |
          pip install ruff==0.14.4
          ruff check --select E9,F --exclude nb,nb_blend .
